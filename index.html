<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>공연 모아보기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1FA;--paper:#FFFFFF;--ink:#1B2559;--muted:#5B6490;--line:#CBD3EE;--soft:#DCE3F7;
  --pick:#F5B700;--pickink:#1B2559;--warn:#D9482B;color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0F1330;--paper:#1A2048;--ink:#E9EDFC;--muted:#9AA3D0;--line:#323B73;--soft:#2B3366;--warn:#FF8A6B;color-scheme:dark}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5;padding-bottom:40px}
.wrap{max-width:600px;margin:0 auto;padding:20px 16px}
h1{font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-weight:400;font-size:34px;line-height:1.15;margin:4px 0 2px}
.sub{color:var(--muted);margin:0 0 16px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.lab{font-size:13px;font-weight:700;color:var(--muted);min-width:46px}
button,select,input{font:inherit;color:inherit}
.chip{all:unset;box-sizing:border-box;cursor:pointer;padding:7px 13px;border-radius:999px;border:2px solid var(--line);background:var(--paper);font-weight:500;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:6px 14px;font-size:14px;font-weight:500;background:var(--paper)}
.seg button[aria-pressed="true"]{background:var(--pick);color:var(--pickink);font-weight:700}
select,input[type=search]{background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:8px 10px;min-height:40px}
input[type=search]{flex:1;min-width:0}
:focus-visible{outline:3px solid #2B6CE0;outline-offset:2px}
h2{font-size:16px;margin:22px 0 8px}
h2 span{font-size:12px;font-weight:500;color:var(--muted);margin-left:6px}
.card{display:flex;gap:12px;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.poster{width:64px;height:88px;border-radius:8px;object-fit:cover;background:var(--soft);flex:none}
.info{min-width:0;flex:1}
.info h3{margin:0;font-size:16px;line-height:1.35;word-break:keep-all}
.meta{color:var(--muted);font-size:13px;margin:2px 0 6px}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;background:var(--soft);margin-right:6px}
.links{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btn{all:unset;box-sizing:border-box;cursor:pointer;font-weight:700;font-size:13px;padding:6px 12px;border-radius:9px;background:var(--pick);color:var(--pickink)}
.none{font-size:12px;color:var(--muted);margin-top:6px}
.state{padding:30px 10px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:14px}
.state.err{color:var(--warn)}
.prog{font-size:13px;color:var(--muted);margin:10px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn.g{background:var(--soft);color:var(--ink);font-weight:500}
.card{position:relative}
.heart{all:unset;cursor:pointer;position:absolute;top:8px;right:10px;font-size:22px;line-height:1;color:var(--muted);padding:4px}
.heart[aria-pressed="true"]{color:#E5484D}
.info h3{padding-right:30px}
.price{font-size:13px;font-weight:700;margin:0 0 6px}
.tag.soon{background:var(--warn);color:#fff}
.foot{margin-top:16px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<main class="wrap">
  <h1>공연 모아보기</h1>
  <p class="sub">서울·경기 공연장만 보여 줘요. 뮤지컬은 대극장만 보여요.</p>

  <div class="row"><span class="lab">구분</span>
    <div class="seg" id="mode"><button data-m="popular" aria-pressed="true">인기 공연</button><button data-m="upcoming" aria-pressed="false">공연 예정</button><button data-m="saved" aria-pressed="false">♥ 찜</button></div>
  </div>
  <p class="sub" id="modeNote" style="margin:0 0 6px;font-size:13px"></p>
  <div class="row"><span class="lab">종류</span><div class="row" id="cats" style="margin:0"></div></div>
  <div class="row"><span class="lab">기간</span>
    <select id="period" aria-label="기간 선택">
      <option value="0">오늘부터 30일</option>
      <option value="30">30일 뒤부터 30일</option>
      <option value="60">60일 뒤부터 30일</option>
    </select>
  </div>
  <div class="row"><span class="lab">예산</span>
    <select id="budget" aria-label="예산 선택">
      <option value="0">전체</option>
      <option value="30000">가장 싼 좌석 3만 원 이하</option>
      <option value="50000">가장 싼 좌석 5만 원 이하</option>
      <option value="100000">가장 싼 좌석 10만 원 이하</option>
      <option value="150000">가장 싼 좌석 15만 원 이하</option>
    </select>
  </div>
  <div class="row"><span class="lab">검색</span>
    <input type="search" id="q" placeholder="공연 이름" maxlength="30" aria-label="공연 이름 검색">
    <button class="btn" id="go">검색</button>
  </div>
  <div class="row"><span class="lab">보기</span>
    <div class="seg" id="view"><button data-v="list" aria-pressed="true">목록</button><button data-v="plat" aria-pressed="false">예매처별</button></div>
  </div>

  <div id="out" role="status" aria-live="polite"></div>
  <div class="foot">출처: 공연예술통합전산망(KOPIS). 예매 일정과 좌석 현황은 각 예매처에서 꼭 다시 확인하세요.</div>
</main>

<script>
// 종류 설정: label(버튼 이름), genre(KOPIS 장르 코드), q(공연명 키워드, 선택)
// 장르 코드는 KOPIS 오픈API 문서에서 꼭 확인하고, 필요하면 아래 목록을 고쳐 쓰세요.
var CATS = [
  {label:"전체"},
  {label:"뮤지컬", genre:"GGGA"},
  {label:"연극", genre:"AAAA"},
  {label:"클래식", genre:"CCCA"},
  {label:"국악", genre:"CCCC"},
  {label:"대중음악", genre:"CCCD"},
  {label:"트로트 (부모님)", genre:"CCCD", tag:"trot"}
];
var S = {cat:0, view:"list", mode:"popular", items:[], done:true, err:"", found:0};
var NOTES = {popular:"최근 30일 예매 순위 순서예요. 예매처가 있는 공연만 보여요.", upcoming:"아직 시작하지 않은 공연이에요. 예매처가 아직 없는 공연도 함께 보여요.", saved:"하트를 누른 공연이에요. 이 휴대폰에만 저장돼요."};
var FKEY = "showboard-favs-v1", FAVS = {};
try { FAVS = JSON.parse(localStorage.getItem(FKEY) || "{}") || {}; } catch (e) { FAVS = {}; }
function saveFavs(){ try { localStorage.setItem(FKEY, JSON.stringify(FAVS)); } catch (e) {} }
function won(n){ return n.toLocaleString("ko-KR")+"원"; }
function daysLeft(end){
  var m=(end||"").match(/(\d{4})\D(\d{1,2})\D(\d{1,2})/); if(!m) return null;
  var t=new Date(); t.setHours(0,0,0,0);
  return Math.round((new Date(+m[1],+m[2]-1,+m[3])-t)/864e5);
}
var MAX_PAGES = 5, RUN = 0;
var $ = function(i){return document.getElementById(i)};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function safeUrl(u){return /^https?:\/\//i.test(u||"")?u:""}
function ymd(d){return d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")}

function renderCats(){
  $("cats").innerHTML = CATS.map(function(c,i){
    return '<button class="chip" data-i="'+i+'" aria-pressed="'+(i===S.cat)+'">'+esc(c.label)+'</button>';
  }).join("");
}
function card(x){
  var fav=!!FAVS[x.id], dl=daysLeft(x.end);
  var price = x.minPrice==null ? '' : '<div class="price">'+(x.minPrice===0?'무료':x.minPrice===x.maxPrice?won(x.minPrice):won(x.minPrice)+' ~ '+won(x.maxPrice))+'</div>';
  var poster = x.poster ? '<img class="poster" loading="lazy" referrerpolicy="no-referrer" alt="" src="'+esc(x.poster.replace(/^http:/,"https:"))+'" onerror="this.style.visibility=\'hidden\'">' : '<div class="poster"></div>';
  var links = (x.relates||[]).filter(function(r){return safeUrl(r.url)}).map(function(r){
    return '<a class="btn" href="'+esc(r.url)+'" target="_blank" rel="noopener noreferrer">'+esc(r.name)+'</a>';
  }).join("");
  return '<div class="card">'+poster+'<button class="heart" data-fav="'+esc(x.id)+'" aria-pressed="'+fav+'" aria-label="찜하기">'+(fav?'♥':'♡')+'</button><div class="info"><h3>'+esc(x.name)+'</h3>'+
    '<div class="meta">'+esc(x.venue)+'<br>'+esc(x.start)+' ~ '+esc(x.end)+'</div>'+price+
    (dl!=null&&dl>=0&&dl<=14?'<span class="tag soon">곧 종료 '+(dl===0?'오늘':'D-'+dl)+'</span>':'')+
    (S.mode==="popular"&&x.rank&&x.rank<999?'<span class="tag" style="background:var(--pick);color:var(--pickink)">'+esc((x.area||"").slice(0,2))+' '+x.rank+'위</span>':'')+
    '<span class="tag">'+esc(x.genre)+'</span>'+(x.seats?'<span class="tag">'+x.seats.toLocaleString("ko-KR")+'석</span>':'')+
    '<span class="tag">'+esc((x.area||"").replace(/특별시|광역시|도$/,""))+'</span>'+
    (links?'<div class="links">'+links+'</div>':'<div class="none">예매처 미정</div>')+'</div></div>';
}
function visible(){
  var b=+$("budget").value;
  return b ? S.items.filter(function(x){return x.minPrice!=null && x.minPrice<=b}) : S.items;
}
function render(){
  var items=visible();
  var head = S.err ? '<div class="state err">'+esc(S.err)+'</div>'
    : (!S.done ? '<div class="prog">공연을 확인하는 중이에요. 지금까지 '+S.items.length+'개 찾았어요. <button class="btn g" id="stop">그만 찾기</button></div>' : '');
  if(!items.length){
    $("out").innerHTML = head + (S.done&&!S.err ? '<div class="state">'+(S.mode==="saved"&&!S.items.length?'아직 찜한 공연이 없어요. 공연 카드의 ♡를 눌러 보세요.':'조건에 맞는 공연이 없어요.'+(+$("budget").value?' 가격 정보가 없는 공연은 예산 필터에서 빠져요.':''))+'</div>' : '');
  } else if(S.view==="list"){
    $("out").innerHTML = head + items.map(card).join("");
  } else {
    var groups={},order=[];
    items.forEach(function(x){(x.relates||[]).forEach(function(r){if(!groups[r.name]){groups[r.name]=[];order.push(r.name)}groups[r.name].push(x)})});
    $("out").innerHTML = head + order.map(function(n){
      return '<h2>'+esc(n)+'<span>'+groups[n].length+'개</span></h2>'+groups[n].map(card).join("");
    }).join("");
  }
  var st=$("stop"); if(st) st.onclick=function(){RUN++;S.done=true;render()};
}
function load(){
  if(S.mode==="saved"){
    RUN++; S.err=""; S.done=true;
    S.items=Object.keys(FAVS).map(function(k){return FAVS[k]}).sort(function(p,q){return p.start<q.start?-1:p.start>q.start?1:0});
    render(); return;
  }
  var run=++RUN, c=CATS[S.cat], off=+$("period").value, qv=$("q").value.trim()||c.q||"";
  var a=new Date();a.setDate(a.getDate()+off);
  var b=new Date(a.getTime());b.setDate(b.getDate()+30);
  var base="/api/shows?mode="+S.mode+"&from="+ymd(a)+"&to="+ymd(b)+(c.genre?"&genre="+c.genre:"")+(qv?"&q="+encodeURIComponent(qv):"")+(c.tag?"&tag="+c.tag:"");
  var page=1, offset=0, seen={};
  S.items=[];S.done=false;S.err="";render();
  function step(){
    if(run!==RUN) return;
    fetch(base+"&page="+page+"&offset="+offset)
    .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||"오류");return j})})
    .then(function(j){
      if(run!==RUN) return;
      (j.items||[]).forEach(function(x){if(!seen[x.id]){seen[x.id]=1;S.items.push(x)}});
      if(S.mode==="upcoming") S.items.sort(function(p,q){return p.start<q.start?-1:p.start>q.start?1:0});
      if(j.next && j.next.page<=MAX_PAGES){page=j.next.page;offset=j.next.offset;render();setTimeout(step,500)}
      else{S.done=true;render()}
    })
    .catch(function(e){if(run!==RUN)return;S.done=true;S.err=e.message||"불러오지 못했어요.";render()});
  }
  step();
}
$("cats").addEventListener("click",function(e){var b=e.target.closest("[data-i]");if(!b)return;S.cat=+b.dataset.i;renderCats();load()});
$("period").addEventListener("change",load);
$("go").addEventListener("click",load);
$("q").addEventListener("keydown",function(e){if(e.key==="Enter")load()});
$("view").addEventListener("click",function(e){var b=e.target.closest("[data-v]");if(!b)return;S.view=b.dataset.v;
  Array.prototype.forEach.call($("view").children,function(x){x.setAttribute("aria-pressed",String(x===b))});render()});
$("mode").addEventListener("click",function(e){var b=e.target.closest("[data-m]");if(!b)return;S.mode=b.dataset.m;
  Array.prototype.forEach.call($("mode").children,function(x){x.setAttribute("aria-pressed",String(x===b))});$("modeNote").textContent=NOTES[S.mode];load()});
$("modeNote").textContent=NOTES[S.mode];
$("budget").addEventListener("change",render);
$("out").addEventListener("click",function(e){
  var b=e.target.closest("[data-fav]"); if(!b) return;
  var id=b.dataset.fav;
  if(FAVS[id]) delete FAVS[id];
  else { var x=S.items.filter(function(i){return i.id===id})[0]; if(x) FAVS[id]={id:x.id,name:x.name,start:x.start,end:x.end,venue:x.venue,area:x.area,poster:x.poster,genre:x.genre,relates:x.relates,minPrice:x.minPrice,maxPrice:x.maxPrice}; }
  saveFavs();
  if(S.mode==="saved") load(); else render();
});
renderCats();load();
</script>
</body>
</html>
